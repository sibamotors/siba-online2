name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build FIRST: it regenerates src/routeTree.gen.ts, which typecheck needs
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-secret-ci-only-secret-0123456789
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
